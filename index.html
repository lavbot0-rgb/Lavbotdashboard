<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lavbot Bullpen Dashboard</title>
  <style>
    :root {
      --bg: #f2f2f7;
      --card: rgba(255,255,255,0.94);
      --text: #111827;
      --muted: #6b7280;
      --line: rgba(17,24,39,0.08);
      --shadow: 0 10px 24px rgba(15,23,42,0.07);
      --accent: #007aff;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #f59e0b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --card: rgba(44,44,46,0.96);
        --text: #f5f5f7;
        --muted: #a1a1aa;
        --line: rgba(255,255,255,0.08);
        --shadow: 0 10px 28px rgba(0,0,0,0.24);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    }
    .sticky-summary {
      position: sticky;
      top: 8px;
      z-index: 10;
      margin-bottom: 16px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(255,255,255,0.72);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    @media (prefers-color-scheme: dark) {
      .sticky-summary { background: rgba(44,44,46,0.72); }
    }
    .sticky-label { font-size: 11px; color: var(--muted); }
    .sticky-value { font-size: 15px; font-weight: 600; margin-top: 2px; }
    .header { margin-bottom: 20px; }
    .title { margin: 0 0 6px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
    .subtitle { font-size: 15px; line-height: 1.45; color: var(--muted); }
    .section { margin-top: 24px; }
    .section h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stack { display: grid; gap: 12px; }
    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 18px;
      box-shadow: var(--shadow);
      transition: transform 220ms ease-in-out;
      border: 0;
    }
    .card:hover { transform: translateY(-1px); }
    .label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .value { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; }
    .subvalue { margin-top: 8px; font-size: 13px; color: var(--muted); }
    .good { color: var(--green); }
    .bad { color: var(--red); }
    .warn { color: var(--orange); }
    .chart-wrap { position: relative; }
    canvas { width: 100%; height: 220px; display: block; }
    .chart-note { margin-top: 10px; font-size: 13px; color: var(--muted); }
    .list { display: grid; gap: 8px; }
    .item { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: none; }
    .item-title { font-size: 15px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; }
    .item-meta { font-size: 13px; line-height: 1.45; color: var(--muted); }
    .table-wrap { display: grid; gap: 10px; }
    .table-row {
      display: grid;
      gap: 4px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .table-row:last-child { border-bottom: none; }
    .table-title { font-size: 15px; font-weight: 600; line-height: 1.35; }
    .table-meta { font-size: 13px; line-height: 1.45; color: var(--muted); }
    .pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(0,122,255,0.10);
      color: var(--accent);
      font-size: 12px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .empty { font-size: 14px; color: var(--muted); padding: 6px 0; }
    @media (min-width: 768px) {
      .wrap { max-width: 1100px; padding: 24px; }
      .summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
      .stack-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .sticky-summary { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="sticky-summary" id="stickySummary"></div>

    <header class="header">
      <h1 class="title">Lavbot Bullpen Dashboard</h1>
      <div class="subtitle" id="subtitle">Loading dashboard...</div>
    </header>

    <section class="summary-grid" id="summary"></section>

    <section class="section">
      <div class="card">
        <h2>Equity</h2>
        <div class="chart-wrap">
          <canvas id="equityChart" width="1200" height="260"></canvas>
        </div>
        <div class="chart-note" id="chartNote"></div>
      </div>
    </section>

    <section class="section stack-2 stack">
      <div class="card">
        <h2>Top Signals</h2>
        <div class="list" id="signals"></div>
      </div>
      <div class="card">
        <h2>Recent Activity</h2>
        <div class="list" id="activity"></div>
      </div>
    </section>

    <section class="section stack-2 stack">
      <div class="card">
        <h2>Open Positions</h2>
        <div class="table-wrap" id="openPositions"></div>
      </div>
      <div class="card">
        <h2>Recent Closed Trades</h2>
        <div class="table-wrap" id="closedPositions"></div>
      </div>
    </section>
  </div>

  <script>
    const money = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(Number(n || 0));
    const pct = (n) => `${(Number(n || 0) * 100).toFixed(2)}%`;
    const cls = (n) => Number(n || 0) > 0 ? 'good' : Number(n || 0) < 0 ? 'bad' : '';

    function card(label, value, note = '', noteClass = '') {
      return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div>${note ? `<div class="subvalue ${noteClass}">${note}</div>` : ''}</div>`;
    }

    function renderList(el, items, mapper, empty) {
      if (!items.length) { el.innerHTML = `<div class="empty">${empty}</div>`; return; }
      el.innerHTML = items.map(mapper).join('');
    }

    function renderRows(el, rows, mapper, empty) {
      if (!rows.length) { el.innerHTML = `<div class="empty">${empty}</div>`; return; }
      el.innerHTML = rows.map(mapper).join('');
    }

    function drawChart(points) {
      const canvas = document.getElementById('equityChart');
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(107,114,128,0.15)';
      ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        const y = (h / 4) * i;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }
      if (!points.length) return;
      const vals = points.map(p => Number(p.ending_equity || p.cash || 0));
      const min = Math.min(...vals), max = Math.max(...vals), range = Math.max(max - min, 1);
      const gradient = ctx.createLinearGradient(0, 0, 0, h);
      gradient.addColorStop(0, 'rgba(0,122,255,0.30)');
      gradient.addColorStop(1, 'rgba(0,122,255,0.02)');

      const pts = vals.map((v, i) => ({
        x: 20 + ((w - 40) * (vals.length === 1 ? 0.5 : i / (vals.length - 1))),
        y: h - 20 - ((v - min) / range) * (h - 40)
      }));

      ctx.beginPath();
      pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
      ctx.lineTo(pts[pts.length - 1].x, h - 20);
      ctx.lineTo(pts[0].x, h - 20);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.beginPath();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#007aff';
      pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
      ctx.stroke();

      const last = pts[pts.length - 1];
      ctx.beginPath();
      ctx.fillStyle = '#007aff';
      ctx.arc(last.x, last.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    fetch('./dashboard-data.json')
      .then(r => r.json())
      .then(data => {
        document.getElementById('subtitle').textContent = `Updated ${data.updated_at || 'unknown'} • ${data.summary.signals_now} signals • ${data.summary.open_positions} open`;

        document.getElementById('stickySummary').innerHTML = [
          ['Cash', money(data.summary.cash)],
          ['Equity', money(data.summary.ending_equity)],
          ['PnL', money(data.summary.realized_pnl)],
        ].map(([k,v]) => `<div><div class="sticky-label">${k}</div><div class="sticky-value">${v}</div></div>`).join('');

        document.getElementById('summary').innerHTML = [
          card('Cash', money(data.summary.cash)),
          card('Equity', money(data.summary.ending_equity)),
          card('Today PnL', money(data.summary.realized_pnl), pct(data.summary.total_return), cls(data.summary.total_return)),
          card('Win Rate', pct(data.summary.win_rate), `${data.summary.closed_positions} real closed trades`),
        ].join('');

        document.getElementById('chartNote').textContent = `${data.summary.closed_positions} real priced exits shown, older placeholder exits hidden.`;

        renderList(
          document.getElementById('signals'),
          (data.signals || []).slice(0, 5),
          s => `<div class="item"><div class="item-title">${s.title}<span class="pill">${s.side}</span></div><div class="item-meta">${s.wallet_count} wallets • ${s.buying_wallets} buyers • score ${s.avg_wallet_score} • price ${s.price}</div></div>`,
          'No strong signals right now.'
        );

        renderList(
          document.getElementById('activity'),
          (data.recent_activity || []).slice(0, 6),
          a => `<div class="item"><div class="item-title">${a.type}${a.title ? ` • ${a.title}` : ''}</div><div class="item-meta">${a.reason || ''}${a.realized_pnl !== undefined && a.realized_pnl !== null ? ` • ${money(a.realized_pnl)}` : ''}</div></div>`,
          'No recent activity.'
        );

        renderRows(
          document.getElementById('openPositions'),
          data.open_positions || [],
          p => `<div class="table-row"><div class="table-title">${p.title} <span class="pill">${p.side}</span></div><div class="table-meta">Entry ${money(p.entry_usd)} • PnL <span class="${cls(p.unrealized_pnl)}">${money(p.unrealized_pnl)}</span></div></div>`,
          'No open positions.'
        );

        renderRows(
          document.getElementById('closedPositions'),
          (data.closed_positions || []).slice(0, 6),
          p => `<div class="table-row"><div class="table-title">${p.title}</div><div class="table-meta">${p.exit_reason || '-'} • <span class="${cls(p.realized_pnl)}">${money(p.realized_pnl)}</span></div></div>`,
          'No closed trades yet.'
        );

        drawChart(data.equity_curve || []);
      })
      .catch(err => {
        document.getElementById('subtitle').textContent = `Failed to load dashboard data: ${err}`;
      });
  </script>
</body>
</html>
